@if (!layout().bare) {
  <a href="#main" class="skip-link" (click)="skipToMain($event)">{{ strings.t('nav.skip') }}</a>
  <header class="site-header">
    <p class="brand">{{ siteName }}</p>
    <app-site-nav [forceCollapsed]="layout().forceCollapsedNav" />
  </header>
}

<main id="main" tabindex="-1" [class.full-bleed]="layout().fullBleed || layout().bare">
  <router-outlet />
</main>

@if (!layout().bare) {
  <footer class="site-footer">
    <app-social-links />
    <a routerLink="/contatti" class="site-footer__link">{{ strings.t('footer.contattami') }}</a>
    <a routerLink="/note-legali" class="site-footer__link">{{ strings.t('footer.note_legali') }}</a>
  </footer>
}
